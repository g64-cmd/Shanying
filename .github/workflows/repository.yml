name: Repository baseline

on:
  push:
    branches: [main, dev/backend, dev/web, dev/android]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Check repository structure and documentation
        run: node scripts/check-repository.mjs
      - name: Check patch whitespace
        run: git show --format= --check HEAD
