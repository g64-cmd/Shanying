openapi: 3.0.3
info:
  title: Shanying API
  version: 0.1.0
  description: 后端底座与账号权限首切片设计契约，尚未实现。行为约束详见docs/api/account-access.md。
servers:
  - url: /
    description: 同源或部署根地址；统一包含/api/v1前缀的paths
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: 进程存活
      description: 不检查数据库；不暴露版本/环境/秘密。
      security: []
      parameters: []
      responses:
        "200":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/Error400"
        "403":
          $ref: "#/components/responses/Error403"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
  /health/ready:
    get:
      operationId: getReadiness
      summary: 服务就绪
      description: 检查数据库、迁移版本和停止状态；未就绪503。
      security: []
      parameters: []
      responses:
        "200":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/Error400"
        "403":
          $ref: "#/components/responses/Error403"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
  /api/v1/auth/registration-requests:
    post:
      operationId: requestRegistration
      summary: 请求注册验证邮件
      description: 邮箱存在或按邮箱抑制仍202固定消息；同用途新令牌替代旧令牌，间隔60s。
      security: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      responses:
        "202":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "400":
          $ref: "#/components/responses/Error400"
        "403":
          $ref: "#/components/responses/Error403"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
  /api/v1/auth/registration-confirmations:
    post:
      operationId: confirmRegistration
      summary: 确认邮箱并创建账号
      description: 有效注册令牌+密码创建active账号；不自动登录；已使用/过期统一400 TOKEN_INVALID。
      security: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      responses:
        "201":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResult"
        "400":
          $ref: "#/components/responses/Error400"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationConfirmation"
  /api/v1/auth/password-reset-requests:
    post:
      operationId: requestPasswordReset
      summary: 请求找回密码邮件
      description: 存在/不存在/邮箱抑制统一202；无账号不发信。
      security: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      responses:
        "202":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "400":
          $ref: "#/components/responses/Error400"
        "403":
          $ref: "#/components/responses/Error403"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
  /api/v1/auth/password-resets:
    post:
      operationId: resetPassword
      summary: 确认找回密码
      description: 单次消费令牌，改密码并撤销全部会话，不自动登录；重复令牌400。
      security: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: 操作成功，无响应体
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
        "400":
          $ref: "#/components/responses/Error400"
        "403":
          $ref: "#/components/responses/Error403"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReset"
  /api/v1/auth/sessions:
    post:
      operationId: login
      summary: 密码登录
      description: 错误邮箱/密码统一401 AUTHENTICATION_FAILED，正确密码但suspended为403 ACCOUNT_DISABLED；web两个HttpOnly
        cookies，android返回tokens；响应丢失需重新登录，不重放凭据响应。
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientType"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
            Set-Cookie:
              description: 仅Web，分别设置__Host-sy_access及__Host-sy_refresh，两条独立Set-Cookie；Android不设置。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: 轮换刷新
      description: web仅{}且由refresh cookie识别；android必须refresh_token且无cookies。旧used令牌重放撤销整个session；不得自动重试；响应丢失重新登录。
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientType"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
            Set-Cookie:
              description: 仅Web，分别设置__Host-sy_access及__Host-sy_refresh，两条独立Set-Cookie；Android不设置。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 退出当前会话
      description: web由refresh cookie或access cookie识别并清cookie；android使用body refresh或Bearer
        access（二者同session才允许）；未知凭据也204；DB故障503不谎称已撤销。
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientType"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: 操作成功，无响应体
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
        "400":
          $ref: "#/components/responses/Error400"
        "403":
          $ref: "#/components/responses/Error403"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
  /api/v1/me:
    get:
      operationId: getMe
      summary: 本人资料
      description: 本人资料
      security:
        - BearerAccess: []
        - WebAccessCookie: []
      parameters: []
      responses:
        "200":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
  /api/v1/me/profile:
    patch:
      operationId: updateProfile
      summary: 修改本人昵称和简介
      description: expected_version必填；至少修改一字段；version冲突409；不能修改邮箱/status/角色。
      security:
        - BearerAccess: []
        - WebAccessCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
  /api/v1/me/privacy:
    patch:
      operationId: updatePrivacy
      summary: 修改账号私密状态
      description: 保留既有粉丝；转公开不自动批准pending申请；version冲突409。
      security:
        - BearerAccess: []
        - WebAccessCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyUpdate"
  /api/v1/me/password:
    post:
      operationId: changePassword
      summary: 修改密码并退出全部设备
      description: 验证当前密码，成功后撤销全部sessions；Web清cookies，客户端重新登录。
      security:
        - BearerAccess: []
        - WebAccessCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: 操作成功，无响应体
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
  /api/v1/me/sessions:
    get:
      operationId: listSessions
      summary: 本人的会话列表
      description: 本人的会话列表
      security:
        - BearerAccess: []
        - WebAccessCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
  /api/v1/me/sessions/{session_id}:
    delete:
      operationId: revokeSession
      summary: 撤销本人的一个会话
      description: 只能本人所有；已撤销仍204；他人/不存在404；撤销当前会话清cookie。
      security:
        - BearerAccess: []
        - WebAccessCookie: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: 操作成功，无响应体
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
  /api/v1/users/{user_id}:
    get:
      operationId: getPublicUser
      summary: 用户最小公开资料
      description: 可匿名；携带无效凭据401。任一向拉黑时双方查询404；无邮箱/社交图。
      security:
        - {}
        - BearerAccess: []
        - WebAccessCookie: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
  /api/v1/users/{user_id}/relationship:
    get:
      operationId: getRelationship
      summary: 查看与目标的关系
      description: 受保护；被屏蔽对象404，本人的黑名单另有接口。
      security:
        - BearerAccess: []
        - WebAccessCookie: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
  /api/v1/users/{user_id}/follow:
    put:
      operationId: followUser
      summary: 关注或申请关注
      description: 公开accepted，私密pending；重复PUT不新增；屏蔽403 RELATIONSHIP_NOT_ALLOWED，自关联400。
      security:
        - BearerAccess: []
        - WebAccessCookie: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: "成功；身份响应Cache-Control: no-store。"
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
    delete:
      operationId: unfollowUser
      summary: 取消关注或申请
      description: 无关系也204，删除后不影响反向关系。
      security:
        - BearerAccess: []
        - WebAccessCookie: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
