components:
  securitySchemes:
    BearerAccess:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Android access token；与cookie互斥。
    WebAccessCookie:
      type: apiKey
      in: cookie
      name: __Host-sy_access
      description: Web HttpOnly access cookie；写操作另要求Origin及CSRF头。
  parameters:
    ClientType:
      name: X-Client-Type
      in: header
      required: true
      schema:
        type: string
        enum:
          - web
          - android
      description: 凭据交付类型，不是身份授权；web要求Origin和CSRF头；android拒绝cookie。
    CSRF:
      name: X-CSRF-Protection
      in: header
      required: false
      schema:
        type: string
        enum:
          - "1"
      description: 所有Web/携带cookie写请求必填，缺失403；Android无cookie不要求。
    Origin:
      name: Origin
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
      description: Web写请求必填且精确匹配允许源；任意请求显式不可信Origin均拒绝。
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
      description: 绑定调用者/集合/首请求as_of的签名游标，15分钟有效；无下一页返回null。
  responses:
    Error400:
      description: 参数、令牌、cursor或自关联无效
      headers:
        X-Request-ID:
          schema:
            type: string
            minLength: 1
            maxLength: 64
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error401:
      description: 身份/会话无效
      headers:
        X-Request-ID:
          schema:
            type: string
            minLength: 1
            maxLength: 64
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error403:
      description: 来源、CSRF、权限或关系操作被拒绝
      headers:
        X-Request-ID:
          schema:
            type: string
            minLength: 1
            maxLength: 64
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error404:
      description: 对象不存在或无权访问
      headers:
        X-Request-ID:
          schema:
            type: string
            minLength: 1
            maxLength: 64
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error409:
      description: 版本/状态冲突
      headers:
        X-Request-ID:
          schema:
            type: string
            minLength: 1
            maxLength: 64
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error413:
      description: JSON超过32KiB
      headers:
        X-Request-ID:
          schema:
            type: string
            minLength: 1
            maxLength: 64
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error415:
      description: 写请求必须application/json
      headers:
        X-Request-ID:
          schema:
            type: string
            minLength: 1
            maxLength: 64
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error429:
      description: 请求频率超限
      headers:
        X-Request-ID:
          schema:
            type: string
            minLength: 1
            maxLength: 64
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: 重试前等待的秒数
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error500:
      description: 内部失败，不暴露堆栈
      headers:
        X-Request-ID:
          schema:
            type: string
            minLength: 1
            maxLength: 64
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error503:
      description: 依赖不可用或尚未就绪
      headers:
        X-Request-ID:
          schema:
            type: string
            minLength: 1
            maxLength: 64
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
        - request_id
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - TOKEN_INVALID
                - ACCOUNT_UNAVAILABLE
                - AUTHENTICATION_FAILED
                - SESSION_INVALID
                - ACCOUNT_DISABLED
                - FORBIDDEN
                - ORIGIN_REJECTED
                - CSRF_REJECTED
                - NOT_FOUND
                - VERSION_CONFLICT
                - REQUEST_NOT_PENDING
                - RELATIONSHIP_NOT_ALLOWED
                - SELF_RELATIONSHIP
                - INVALID_CURSOR
                - RATE_LIMITED
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - INTERNAL_ERROR
                - SERVICE_UNAVAILABLE
            message:
              type: string
              minLength: 1
              maxLength: 200
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                    minLength: 1
                    maxLength: 100
                  code:
                    type: string
                    minLength: 1
                    maxLength: 60
        request_id:
          type: string
          minLength: 1
          maxLength: 64
    Accepted:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          enum:
            - 如该邮箱可用于此操作，我们将发送邮件。
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: ASCII邮箱，trim后整体小写；不折叠点号或+后缀。
    RegistrationConfirmation:
      type: object
      additionalProperties: false
      required:
        - token
        - password
        - display_name
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 32字节随机值的无填充base64url；示例为测试值。
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Unicode标量长度；不trim或规范化。
        display_name:
          type: string
          minLength: 1
          maxLength: 40
    PasswordReset:
      type: object
      additionalProperties: false
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 32字节随机值的无填充base64url；示例为测试值。
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Unicode标量长度；不trim或规范化。
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - device_name
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: ASCII邮箱，trim后整体小写；不折叠点号或+后缀。
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: Unicode标量长度；不trim或规范化。
        device_name:
          type: string
          minLength: 1
          maxLength: 80
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 32字节随机值的无填充base64url；示例为测试值。
    ProfileUpdate:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        bio:
          type: string
          minLength: 0
          maxLength: 200
        expected_version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      description: 至少提供display_name或bio之一；未知字段拒绝。
      anyOf:
        - required:
            - display_name
        - required:
            - bio
    PrivacyUpdate:
      type: object
      additionalProperties: false
      required:
        - is_private
        - expected_version
      properties:
        is_private:
          type: boolean
        expected_version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
    PasswordChange:
      type: object
      additionalProperties: false
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: Unicode标量长度；不trim或规范化。
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Unicode标量长度；不trim或规范化。
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - bio
        - is_private
        - created_at
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        bio:
          type: string
          minLength: 0
          maxLength: 200
        is_private:
          type: boolean
        created_at:
          type: string
          format: date-time
    Me:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - display_name
        - bio
        - is_private
        - version
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
          description: ASCII邮箱，trim后整体小写；不折叠点号或+后缀。
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        bio:
          type: string
          minLength: 0
          maxLength: 200
        is_private:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        created_at:
          type: string
          format: date-time
    RegistrationResult:
      type: object
      additionalProperties: false
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - client_type
        - device_name
        - created_at
        - last_seen_at
        - idle_expires_at
        - absolute_expires_at
        - is_current
        - state
      properties:
        id:
          type: string
          format: uuid
        client_type:
          type: string
          enum:
            - web
            - android
        device_name:
          type: string
          minLength: 1
          maxLength: 80
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
        is_current:
          type: boolean
        state:
          type: string
          enum:
            - active
            - expired
            - revoked
    TokenPair:
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - token_type
        - access_expires_at
      properties:
        access_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 32字节随机值的无填充base64url；示例为测试值。
        refresh_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 32字节随机值的无填充base64url；示例为测试值。
        token_type:
          type: string
          enum:
            - Bearer
        access_expires_at:
          type: string
          format: date-time
    WebSessionResult:
      type: object
      additionalProperties: false
      required:
        - session
      properties:
        session:
          allOf:
            - $ref: "#/components/schemas/Session"
            - type: object
              properties:
                client_type:
                  type: string
                  enum:
                    - web
    AndroidSessionResult:
      type: object
      additionalProperties: false
      required:
        - session
        - credentials
      properties:
        session:
          allOf:
            - $ref: "#/components/schemas/Session"
            - type: object
              properties:
                client_type:
                  type: string
                  enum:
                    - android
        credentials:
          $ref: "#/components/schemas/TokenPair"
    SessionResult:
      oneOf:
        - $ref: "#/components/schemas/WebSessionResult"
        - $ref: "#/components/schemas/AndroidSessionResult"
      description: web 仅 session 并 Set-Cookie 两次；android含credentials并不设置cookie。
    Relationship:
      type: object
      additionalProperties: false
      required:
        - target_user_id
        - following_state
        - followed_by
        - is_mutual
      properties:
        target_user_id:
          type: string
          format: uuid
        following_state:
          type: string
          enum:
            - none
            - pending
            - accepted
        followed_by:
          type: boolean
        is_mutual:
          type: boolean
    Follow:
      type: object
      additionalProperties: false
      required:
        - id
        - user
        - state
        - created_at
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
        state:
          type: string
          enum:
            - pending
            - accepted
        created_at:
          type: string
          format: date-time
    Block:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - display_name
        - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        created_at:
          type: string
          format: date-time
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    SessionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        next_cursor:
          type: string
          nullable: true
          maxLength: 2048
    FollowPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Follow"
        next_cursor:
          type: string
          nullable: true
          maxLength: 2048
    BlockPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Block"
        next_cursor:
          type: string
          nullable: true
          maxLength: 2048
